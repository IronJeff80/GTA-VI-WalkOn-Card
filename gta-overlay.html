<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>GTA VI - Overlay Suite v0.1.2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Changa+One&family=Inter:wght@400;600;700;800&family=Montserrat:wght@500;700;800&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/overlays.css">
  <script src="https://unpkg.com/@streamerbot/client/dist/streamerbot-client.js"></script>
</head>
<body class="obs-canvas">

  <!-- MODULE 1: WALK-ON CARD -->
  <div id="walkon-container" class="walkon-container anim-slide-left">
    <div class="walkon-card">
      <div id="avatar-wrapper" class="avatar-wrapper av-flip">
        <img id="card-avatar" class="avatar-img" src="" alt="Avatar" />
      </div>
      <div id="card-username" class="user-name">LUCIA_VI</div>
      <div id="card-tier" class="tier-badge">LEONIDA VIP</div>
      <div id="meta-box" class="meta-box"></div>
    </div>
  </div>

  <!-- MODULE 2: YOUTUBE ALERTS -->
  <div id="alert-container" class="alert-container">
    <div id="alert-box" class="alert-box alert-sub">
      <div class="alert-header">
        <img id="alert-avatar" class="alert-avatar" src="" alt="Alert Avatar" />
        <div class="alert-titles">
          <div id="alert-event-name" class="alert-event-name">New Subscriber</div>
          <div id="alert-user-name" class="alert-user-name">Username</div>
        </div>
      </div>
      <div id="alert-body" class="alert-body"></div>
    </div>
  </div>

  <!-- MODULE 3: SHOUTOUT TOAST -->
  <div id="shoutout-container" class="shoutout-container so-roll">
    <div id="shoutout-wrapper" class="shoutout-wrapper">
      <div class="shoutout-text-box">
        <div id="shoutout-title" class="shoutout-title"><i class="fa-solid fa-bullhorn"></i> SHOUTOUT</div>
        <div id="shoutout-name" class="shoutout-name">JASON_LEONIDA</div>
      </div>
      <img id="shoutout-avatar" class="shoutout-avatar" src="" alt="Shoutout Avatar" />
    </div>
  </div>

  <!-- MODULE 4: HORIZONTAL CHAT BAR -->
  <div id="chat-container" class="chat-container">
    <div id="chat-bar" class="chat-bar">
      <div id="chat-track" class="chat-track"></div>
    </div>
  </div>

  <!-- MODULE 5: Q&A / CHAT HIGHLIGHT TOAST -->
  <div id="qa-container" class="qa-container qa-slide-up">
    <div id="qa-box" class="qa-box">
      <img id="qa-avatar" class="qa-avatar" src="" alt="Q&A Avatar" />
      <div class="qa-content">
        <div class="qa-header-row">
          <div id="qa-username" class="qa-username">LUCIA_CAMINOS</div>
          <div id="qa-badge" class="qa-badge"><i class="fa-solid fa-comments"></i> Q&amp;A HIGHLIGHT</div>
        </div>
        <div id="qa-message" class="qa-message">Welcome to Leonida! Drop your questions in chat!</div>
      </div>
    </div>
  </div>

  <script src="js/overlays.js"></script>
</body>
</html>
